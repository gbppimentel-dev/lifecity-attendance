name: Android Test APK

# Manual only. Editing/pushing the website does not trigger an Android build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MOBILE_SUPABASE_PUBLISHABLE_KEY }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Verify public app configuration
        run: node scripts/check-config.cjs
      - name: Install native dependencies
        # The first successful run produces a lockfile artifact. Commit that
        # reviewed lockfile; subsequent builds use npm ci automatically.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check Expo dependency compatibility
        run: npm run check
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Export Android JavaScript bundle
        run: npm run export:android
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build self-contained internal test APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Preserve reviewed dependency lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-dependency-lock
          path: apps/mobile/package-lock.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Downloadable test APK
        uses: actions/upload-artifact@v7
        with:
          name: LifeCity-Android-Internal-Test
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
